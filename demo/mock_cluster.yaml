---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: demo

---
# Ingress for external traffic
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-nginx
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: demo
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: demo
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      namespace: demo
    spec:
      containers:
      - name: frontend
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        env:
        - name: API_BASE_URL
          value: "http://api-svc:8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: demo
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: demo
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      namespace: demo
    spec:
      containers:
      - name: api
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
        env:
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-svc:8080"
        - name: AUTH_SERVICE_URL
          value: "http://auth-svc:8080"
        - name: DATABASE_URL
          value: "postgresql://postgres-svc:5432"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
# Payment Service (critical - failure target)
apiVersion: v1
kind: Service
metadata:
  name: payment-svc
  namespace: demo
  labels:
    app: payment
    tier: payment-gateway
spec:
  type: ClusterIP
  selector:
    app: payment
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# Payment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: demo
  labels:
    app: payment
spec:
  replicas: 1
  # Recreate so a failed image update makes the workload unhealthy immediately
  # (no surge pod keeping it "Ready" during the demo failure injection).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
      namespace: demo
    spec:
      containers:
      - name: payment
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
        env:
        - name: PG_GATEWAY_URL
          value: "https://api.payment-gateway.external"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

---
# Auth Service
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: demo
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# Auth Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: demo
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      namespace: demo
    spec:
      containers:
      - name: auth
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres-svc:5432"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: demo
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP

---
# Postgres Deployment (stateless for demo; use StatefulSet in production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      namespace: demo
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "demo-password"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
